name: Sync to GitLab mirror

# GitHub -> GitLab half of the bidirectional mirror. It uses a write-enabled
# GitLab deploy key stored in the GITLAB_DEPLOY_KEY repository secret.
# The GitLab -> GitHub half is a native GitLab push mirror using a GitHub
# deploy key. Identical pushes are no-ops, so this cannot loop.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Mirror Bot"
          git config user.email "mirror-bot@users.noreply.github.com"

      - name: Push refs to GitLab
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          : "${GITLAB_DEPLOY_KEY:?GITLAB_DEPLOY_KEY secret is required}"
          eval "$(ssh-agent -s)"
          printf '%s\n' "${GITLAB_DEPLOY_KEY}" | ssh-add -
          mkdir -p "${HOME}/.ssh"
          ssh-keyscan -t ed25519 gitlab.com >> "${HOME}/.ssh/known_hosts"
          git remote add gitlab git@gitlab.com:essential_repos/kali-installer-ubuver.git
          git push gitlab HEAD:main
          git push gitlab --tags
